version: "3.9"

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DATAPLATFORM_DATABASE_URL: sqlite:///./control_plane.db
    command: sh -c "pip install -r requirements.txt && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DATAPLATFORM_DATABASE_URL: sqlite:///./control_plane.db
    command: sh -c "pip install -r requirements.txt && python -m workers.orchestration.worker"
    depends_on:
      - api
